name: Export question image

on:
  push:
    paths:
      - '.github/workflows/export-question-webp.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: question-webp
          path: club/assets/cards-v89/question.webp
          retention-days: 1
