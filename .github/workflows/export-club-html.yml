name: Export optimized club HTML

on:
  push:
    paths:
      - '.github/workflows/export-club-html.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: club-51rub-optimized-html
          path: club/index-51rub-optimized.html
          if-no-files-found: error
          retention-days: 1
