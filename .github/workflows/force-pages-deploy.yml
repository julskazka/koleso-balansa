name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build stable Club 999 page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re
          import shutil

          root = Path('.')
          source = root / 'club-999'
          site = root / '_site'

          if site.exists():
              shutil.rmtree(site)
          shutil.copytree(root, site, ignore=shutil.ignore_patterns('.git', '_site'))
          output = site / 'club-999'

          payload_files = [
              source / 'payload-v48/part-01.txt',
              source / 'payload-v48/part-02.txt',
              source / 'payload-v48/part-03.txt',
              source / 'payload-v48/part-04.txt',
              source / 'payload-v48/part-05.txt',
              source / 'payload-v48/part-06.txt',
              source / 'payload-v48/p07-01.txt',
              source / 'payload-v48/p07-02.txt',
              source / 'payload-v48/p07-03.txt',
              source / 'payload-v48/p07-04.txt',
              source / 'payload-v48/p07-05.txt',
              source / 'payload-v48/p07-06.txt',
              source / 'payload-v48/p07-07.txt',
              source / 'payload-v48/p07-08.txt',
              source / 'payload-v48/p07-09.txt',
          ]
          hero_files = [source / f'hero-v51/part-{number:02d}.txt' for number in range(1, 9)]
          css_files = [
              source / 'v53.css',
              source / 'v61-bg.css',
              source / 'v62.css',
              source / 'v64.css',
              source / 'v65.css',
              source / 'v66.css',
              source / 'v81-notibot-mobile.css',
          ]
          js_files = [
              source / 'v71-clarity-heading.js',
              source / 'v73-page-typography.js',
              source / 'v74-layout-spacing.js',
              source / 'v75-heading-fit-readability.js',
              source / 'v76-clarity-cards.js',
          ]

          required = payload_files + hero_files + css_files + js_files
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise FileNotFoundError('Missing Club 999 files: ' + ', '.join(missing))

          payload_b64 = ''.join(path.read_text(encoding='utf-8').strip() for path in payload_files)
          html = gzip.decompress(base64.b64decode(payload_b64)).decode('utf-8')

          hero_b64 = ''.join(path.read_text(encoding='utf-8').strip() for path in hero_files)
          hero_path = output / 'hero-v51.webp'
          hero_path.write_bytes(base64.b64decode(hero_b64))

          hero_pattern = re.compile(
              r'(<img\b[^>]*class=["\'][^"\']*\bhero41__art\b[^"\']*["\'][^>]*src=["\'])data:image/webp;base64,[^"\']+(["\'][^>]*>)',
              flags=re.I,
          )
          html, hero_count = hero_pattern.subn(
              r'\1./hero-v51.webp?v=81\2',
              html,
              count=1,
          )
          if hero_count != 1:
              alternate = re.compile(
                  r'(<img\b[^>]*src=["\'])data:image/webp;base64,[^"\']+(["\'][^>]*class=["\'][^"\']*\bhero41__art\b[^"\']*["\'][^>]*>)',
                  flags=re.I,
              )
              html, hero_count = alternate.subn(r'\1./hero-v51.webp?v=81\2', html, count=1)
          if hero_count != 1:
              raise RuntimeError('Hero image was not externalized')

          replacements = {
              '<h1>Найдите точку<br>опоры в той<br>сфере жизни,<br>которая сейчас<br>требует внимания</h1>':
                  '<h1>Найдите точку опоры в той сфере жизни, которая сейчас требует внимания</h1>',
              '<p><strong>6 направлений</strong> — тело, энергия,<br>дело, отношения, окружение и красота</p>':
                  '<p><strong>6 направлений</strong> — тело, энергия, дело, отношения, окружение и красота</p>',
              '<p><strong>Эфиры, конференции, практики</strong><br>и полезные материалы</p>':
                  '<p><strong>Эфиры, конференции, практики</strong> и полезные материалы</p>',
              '<p><strong>Сильные эксперты, живое общение</strong><br>и новые встречи каждый месяц</p>':
                  '<p><strong>Сильные эксперты, живое общение</strong> и новые встречи каждый месяц</p>',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)

          css = '\n\n'.join(path.read_text(encoding='utf-8') for path in css_files)

          jpeg_pattern = re.compile(r'data:image/jpeg;base64,([A-Za-z0-9+/=]+)')
          jpeg_match = jpeg_pattern.search(css)
          if jpeg_match:
              nebula_path = output / 'page-nebula-v61.jpg'
              nebula_path.write_bytes(base64.b64decode(jpeg_match.group(1)))
              css = jpeg_pattern.sub('./page-nebula-v61.jpg?v=81', css, count=1)

          css = css.replace('</style', '<\\/style')
          js = '\n\n'.join(path.read_text(encoding='utf-8') for path in js_files)
          js = js.replace('</script', '<\\/script')

          html = html.replace(
              '</head>',
              '<meta name="club999-build" content="v81-notibot-safe">'
              '<style id="club999-inline-css-v81">' + css + '</style></head>',
              1,
          )
          html, body_count = re.subn(
              r'<body([^>]*)>',
              r'<body\1><div id="page-nebula-v61" aria-hidden="true"></div>',
              html,
              count=1,
              flags=re.I,
          )
          if body_count != 1:
              raise RuntimeError('Body tag was not found')

          html = html.replace(
              '</body>',
              '<script id="club999-inline-js-v81">' + js + '<\\/script></body>',
              1,
          )

          output_html = output / 'index.html'
          output_html.write_text(html, encoding='utf-8')

          if 'Загружаем «Центр Ресурса»' in html or 'Страница временно не загрузилась' in html:
              raise RuntimeError('Runtime loader leaked into published page')
          if 'payload-v48/' in html or 'fflate' in html:
              raise RuntimeError('Runtime payload dependency leaked into published page')
          if './hero-v51.webp?v=81' not in html:
              raise RuntimeError('External hero image reference is missing')
          if 'v81-notibot-safe' not in html:
              raise RuntimeError('Build marker is missing')

          print(f'Published Club 999 HTML: {output_html.stat().st_size} bytes')
          print(f'Published hero image: {hero_path.stat().st_size} bytes')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
