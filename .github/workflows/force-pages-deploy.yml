name: Force Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: force-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build direct Club 999 page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re
          import shutil

          root = Path('.')
          site = Path('_site')
          if site.exists():
              shutil.rmtree(site)
          shutil.copytree(root, site, ignore=shutil.ignore_patterns('.git', '_site'))

          payload_files = [
              root / 'club-999/payload-v48/part-01.txt',
              root / 'club-999/payload-v48/part-02.txt',
              root / 'club-999/payload-v48/part-03.txt',
              root / 'club-999/payload-v48/part-04.txt',
              root / 'club-999/payload-v48/part-05.txt',
              root / 'club-999/payload-v48/part-06.txt',
              root / 'club-999/payload-v48/p07-01.txt',
              root / 'club-999/payload-v48/p07-02.txt',
              root / 'club-999/payload-v48/p07-03.txt',
              root / 'club-999/payload-v48/p07-04.txt',
              root / 'club-999/payload-v48/p07-05.txt',
              root / 'club-999/payload-v48/p07-06.txt',
              root / 'club-999/payload-v48/p07-07.txt',
              root / 'club-999/payload-v48/p07-08.txt',
              root / 'club-999/payload-v48/p07-09.txt',
          ]
          hero_files = [root / f'club-999/hero-v51/part-{i:02d}.txt' for i in range(1, 9)]

          missing = [str(p) for p in payload_files + hero_files if not p.exists()]
          if missing:
              raise FileNotFoundError('Missing build files: ' + ', '.join(missing))

          payload_b64 = ''.join(p.read_text(encoding='utf-8').strip() for p in payload_files)
          html = gzip.decompress(base64.b64decode(payload_b64)).decode('utf-8')
          hero_b64 = ''.join(p.read_text(encoding='utf-8').strip() for p in hero_files)

          hero_match = None
          for candidate in re.finditer(r'<img\b[^>]*>', html, flags=re.I):
              if re.search(r'class\s*=\s*(["\'])[^"\']*\bhero41__art\b[^"\']*\1', candidate.group(0), flags=re.I):
                  hero_match = candidate
                  break
          if hero_match is None:
              raise RuntimeError('Hero image tag was not found')

          hero_tag = hero_match.group(0)
          src_pattern = re.compile(r'(src\s*=\s*)(["\'])data:image/webp;base64,[^"\']+\2', flags=re.I)
          hero_tag, image_count = src_pattern.subn(
              lambda m: m.group(1) + m.group(2) + 'data:image/webp;base64,' + hero_b64 + m.group(2),
              hero_tag,
              count=1,
          )
          if image_count != 1:
              raise RuntimeError('Hero image source was not replaced')
          html = html[:hero_match.start()] + hero_tag + html[hero_match.end():]

          replacements = {
              '<h1>Найдите точку<br>опоры в той<br>сфере жизни,<br>которая сейчас<br>требует внимания</h1>':
                  '<h1>Найдите точку опоры в той сфере жизни, которая сейчас требует внимания</h1>',
              '<p><strong>6 направлений</strong> — тело, энергия,<br>дело, отношения, окружение и красота</p>':
                  '<p><strong>6 направлений</strong> — тело, энергия, дело, отношения, окружение и красота</p>',
              '<p><strong>Эфиры, конференции, практики</strong><br>и полезные материалы</p>':
                  '<p><strong>Эфиры, конференции, практики</strong> и полезные материалы</p>',
              '<p><strong>Сильные эксперты, живое общение</strong><br>и новые встречи каждый месяц</p>':
                  '<p><strong>Сильные эксперты, живое общение</strong> и новые встречи каждый месяц</p>',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)

          background_css = '''
          <style id="page-nebula-v57-direct">
          html,body{background:#010f17!important}
          body{position:relative!important;isolation:isolate!important}
          #page-nebula-v57{
            position:fixed;inset:0;z-index:0;pointer-events:none;
            background:
              radial-gradient(circle at 13% 17%,rgba(210,255,248,.75) 0 1px,transparent 1.4px) 0 0/128px 142px,
              radial-gradient(circle at 72% 29%,rgba(124,220,228,.48) 0 1px,transparent 1.5px) 0 0/173px 161px,
              radial-gradient(circle at 42% 76%,rgba(238,211,133,.28) 0 1px,transparent 1.4px) 0 0/211px 187px,
              radial-gradient(ellipse at 16% 18%,rgba(62,190,191,.24) 0%,rgba(25,128,146,.13) 25%,transparent 55%),
              radial-gradient(ellipse at 84% 24%,rgba(65,139,191,.23) 0%,rgba(32,91,145,.10) 31%,transparent 58%),
              radial-gradient(ellipse at 62% 76%,rgba(45,163,155,.17) 0%,transparent 48%),
              linear-gradient(124deg,transparent 8%,rgba(96,218,213,.05) 24%,rgba(61,155,193,.08) 43%,transparent 65%),
              linear-gradient(180deg,#021722 0%,#032a34 44%,#021c27 71%,#010f17 100%);
          }
          #page-nebula-v57::before{
            content:"";position:absolute;inset:-10%;
            background:
              radial-gradient(ellipse at 24% 32%,rgba(104,225,219,.13),transparent 32%),
              radial-gradient(ellipse at 76% 58%,rgba(70,151,201,.12),transparent 36%),
              linear-gradient(138deg,transparent 22%,rgba(112,225,219,.07) 38%,rgba(67,157,198,.05) 51%,transparent 69%);
            filter:blur(22px);opacity:.9;transform:rotate(-3deg) scale(1.06);
          }
          body::before{display:none!important}
          body::after,.cosmos{z-index:1!important}
          main,.footer{position:relative!important;z-index:2!important;background:transparent!important}
          .section,.section::before,.section::after,.clarity,.directions,.connection,.inside,.questions,.difference,.audience,.return,.access,.final{background-color:transparent!important}
          </style>
          '''

          html = html.replace(
              '</head>',
              '<link rel="stylesheet" href="./v53.css?v=57">' + background_css + '</head>',
              1,
          )
          html, body_count = re.subn(
              r'<body([^>]*)>',
              r'<body\1><div id="page-nebula-v57" aria-hidden="true"></div>',
              html,
              count=1,
              flags=re.I,
          )
          if body_count != 1:
              raise RuntimeError('Body tag was not found')

          output = site / 'club-999/index.html'
          output.write_text(html, encoding='utf-8')
          (site / 'club-999/deploy-version.txt').write_text('v57-direct\n', encoding='utf-8')

          if 'Не удалось загрузить страницу' in html:
              raise RuntimeError('Loader error page leaked into direct build')
          if 'page-nebula-v57' not in html:
              raise RuntimeError('Background layer missing from direct build')
          print(f'Built direct page: {output} ({output.stat().st_size} bytes)')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
