name: Export standalone club 999 HTML

on:
  push:
    paths:
      - '.github/workflows/export-club-999-html.yml'

permissions:
  contents: read

actions:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone HTML
        shell: python
        run: |
          import base64, gzip, pathlib, re
          root = pathlib.Path('club-999')
          payload_files = [
            'payload-v48/part-01.txt','payload-v48/part-02.txt','payload-v48/part-03.txt','payload-v48/part-04.txt','payload-v48/part-05.txt','payload-v48/part-06.txt',
            'payload-v48/p07-01.txt','payload-v48/p07-02.txt','payload-v48/p07-03.txt','payload-v48/p07-04.txt','payload-v48/p07-05.txt','payload-v48/p07-06.txt','payload-v48/p07-07.txt','payload-v48/p07-08.txt','payload-v48/p07-09.txt'
          ]
          hero_files = [f'hero-v51/part-{i:02d}.txt' for i in range(1,9)]
          b64 = ''.join((root/p).read_text(encoding='utf-8').strip() for p in payload_files)
          hero_b64 = ''.join((root/p).read_text(encoding='utf-8').strip() for p in hero_files)
          html = gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          html = re.sub(r'(<img class="hero41__art" src=")data:image/webp;base64,[^"]+(\")', lambda m: m.group(1)+'data:image/webp;base64,'+hero_b64+m.group(2), html, count=1)
          html = html.replace('<h1>Найдите точку<br>опоры в той<br>сфере жизни,<br>которая сейчас<br>требует внимания</h1>','<h1>Найдите точку опоры в той сфере жизни, которая сейчас требует внимания</h1>')
          html = html.replace('<p><strong>6 направлений</strong> — тело, энергия,<br>дело, отношения, окружение и красота</p>','<p><strong>6 направлений</strong> — тело, энергия, дело, отношения, окружение и красота</p>')
          html = html.replace('<p><strong>Эфиры, конференции, практики</strong><br>и полезные материалы</p>','<p><strong>Эфиры, конференции, практики</strong> и полезные материалы</p>')
          html = html.replace('<p><strong>Сильные эксперты, живое общение</strong><br>и новые встречи каждый месяц</p>','<p><strong>Сильные эксперты, живое общение</strong> и новые встречи каждый месяц</p>')

          css_files = [
            'v53.css','v61-bg.css','v62.css','v64.css','v65.css','v66.css','v105-hide-connection-visual.css','v114-expert-gallery-frame.css','v126-resource-icon-cleanup.css','v205-stable-layout.css','v216-popup-text-only.css'
          ]
          css = '\n'.join((root/f).read_text(encoding='utf-8') for f in css_files)
          html = html.replace('</head>', '<style id="club999-inline-patches">\n'+css+'\n</style></head>', 1)

          js_files = [
            'v71-clarity-heading.js','v73-page-typography.js','v75-heading-fit-readability.js','v76-clarity-cards.js','v86-directions-popups.js','v92-real-direction-cards.js','v94-directions-desktop-3col.js','v213-direction-art-blob.js','v103-cross-block-safe-width.js','v106-connection-divider.js','v107-materials-glass-cards.js','v109-inside-payment-button-depth.js','v110-expert-gallery.js','v120-feed-compact.js','v121-resource-list-polish.js','v133-resource-box-clean-rebuild.js','v136-whofor-safe-local.js','v151-audience-question-cta.js','v153-audience-cta-contrast.js','v166-final-ui.js','v169-gold-checks-compact.js','v174-retention-direct.js','v175-access-block-clean.js','v178-access-polish.js','v179-access-list-compact.js','v181-access-final.js','v183-subscription-compact-icons.js','v184-remove-final-visual-footer.js','v190-unified-lists.js','v191-subscription-shell-flat.js','v194-unified-icons-real-shine.js','v195-icons-one-system.js','v198-path-card-square-direct.js','v200-icon-glow-uniform.js','v210-final-spacing-clean.js','v212-final-cta-containment.js','v219-notibot-product-bridge.js'
          ]
          scripts=[]
          for f in js_files:
            js=(root/f).read_text(encoding='utf-8').replace('</script>','<\\/script>')
            scripts.append('<script>\n'+js+'\n</script>')
          html = html.replace('</body>', ''.join(scripts)+'</body>',1)
          html = re.sub(r'<body([^>]*)>', r'<body\1><div id="page-nebula-v61" aria-hidden="true"></div>', html, count=1, flags=re.I)

          out = pathlib.Path('/tmp/club-999-miniapp-direct.html')
          out.write_text(html,encoding='utf-8')
          refs = sorted(set(re.findall(r'(?:src|href)=["\'](?!data:|#|javascript:)([^"\']+)', html, flags=re.I)))
          fetches = sorted(set(re.findall(r'fetch\(["\']([^"\']+)', html)))
          report = pathlib.Path('/tmp/report.txt')
          report.write_text('bytes='+str(out.stat().st_size)+'\nrelative_or_external_refs='+repr(refs)+'\nfetch_refs='+repr(fetches),encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: club-999-miniapp-direct
          path: |
            /tmp/club-999-miniapp-direct.html
            /tmp/report.txt
          retention-days: 1
