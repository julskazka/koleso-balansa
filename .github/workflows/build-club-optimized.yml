name: Build optimized club page

on:
  push:
    paths:
      - '.github/workflows/build-club-optimized.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build single-file optimized page
        shell: python
        run: |
          import base64, gzip, pathlib, re

          root = pathlib.Path('club')
          payload_parts = [
              'payload/payload-01.txt',
              'payload/fix-02-1.txt','payload/fix-02-2.txt','payload/fix-02-3.txt','payload/fix-02-4.txt',
              'payload/payload-03.txt','payload/payload-04.txt','payload/payload-05.txt',
              'payload/fix-06-1.txt','payload/fix-06-2.txt','payload/fix-06-3.txt','payload/fix-06-4.txt',
              'payload/payload-07.txt','payload/payload-08.txt'
          ]
          b64 = ''.join((root / p).read_text(encoding='utf-8').strip() for p in payload_parts)
          html = gzip.decompress(base64.b64decode(b64)).decode('utf-8')

          # Keep the 1-ruble version.
          html = re.sub(r'<title>[\s\S]*?</title>', '<title>7 дней в «Центре Ресурсов» за 1 ₽</title>', html, count=1, flags=re.I)

          # Flat background requested by the user. No raster background image is loaded.
          flat_css = '''<style id="flat-bg-optimized">
          html,body{background:#02131C!important;background-color:#02131C!important;background-image:none!important}
          body:before,body:after{background-image:none!important}
          </style>'''
          html = html.replace('</head>', flat_css + '</head>', 1)

          script_order = [
              'v76-patch.js','v77-scroll-fix.js','v78-popup-no-image.js','v80-popup-bottom-close.js',
              'v89-question-fix.js','v90-mobile-scroll-cue.js','v92-remove-watch-inside-android.js',
              'v93-mobile-buttons-refine.js',
              # v94-price-51.js intentionally omitted
              'v95-promote-start-heading.js','v96-remove-old-heading.js','v97-tighten-start-heading-gap.js',
              'v98-inside-heading-copy.js','v99-mobile-start-gap.js','v100-remove-one-topic-line.js',
              'v101-remove-one-topic-line-inline.js','v102-seven-days-content.js','v103-try-club-inside.js',
              'v104-start-one-question.js'
          ]

          inline_scripts = []
          for name in script_order:
              js = (root / name).read_text(encoding='utf-8').replace('</script>', '<\\/script>')
              inline_scripts.append('<script>\n' + js + '\n</script>')

          # v87 rewritten to use the exact same WebP bytes inline: zero image requests, zero quality loss.
          card_files = {
              'directions':'directions.b64.txt',
              'experts':'experts.b64.txt',
              'question':'question.b64.txt',
              'materials':'materials.b64.txt'
          }
          cards = {k:(root/'assets/cards-v87'/v).read_text(encoding='utf-8').strip() for k,v in card_files.items()}
          card_js = '''<script>
          (()=>{
            const images={DIRECTIONS};
            const LABELS={directions:'6 направлений ресурса. Нажмите, чтобы открыть.',experts:'Разные эксперты и подходы. Нажмите, чтобы открыть.',question:'Ответ на свой вопрос. Нажмите, чтобы открыть.',materials:'Практические материалы. Нажмите, чтобы открыть.'};
            const style=document.createElement('style');
            style.textContent=`#insideCenterSection .inside-grid{gap:10px!important}#insideCenterSection .inside-card.v87-approved-card{position:relative!important;display:block!important;aspect-ratio:4/3!important;min-height:0!important;padding:0!important;overflow:hidden!important;border:0!important;border-radius:20px!important;background:#01242e!important;box-shadow:0 12px 28px rgba(0,0,0,.22),0 0 20px rgba(44,162,182,.08)!important;isolation:isolate!important}#insideCenterSection .inside-card.v87-approved-card::before,#insideCenterSection .inside-card.v87-approved-card::after{display:none!important;content:none!important}#insideCenterSection .inside-card.v87-approved-card .v87-approved-image{position:absolute!important;inset:0!important;z-index:2!important;display:block!important;width:100%!important;height:100%!important;max-width:none!important;object-fit:cover!important;object-position:center!important;border-radius:inherit!important;opacity:1!important;visibility:visible!important;filter:none!important;transform:none!important}#insideCenterSection .inside-card.v87-approved-card:active{transform:scale(.985)!important}@media(max-width:640px){#insideCenterSection .inside-grid{gap:9px!important}#insideCenterSection .inside-card.v87-approved-card{border-radius:17px!important}}`;
            document.head.appendChild(style);
            function apply(){document.querySelectorAll('#insideCenterSection .inside-card[data-popup]').forEach(card=>{const key=card.getAttribute('data-popup');if(!images[key])return;card.className='inside-card v87-approved-card';card.setAttribute('aria-label',LABELS[key]);const img=document.createElement('img');img.className='v87-approved-image';img.alt='';img.setAttribute('aria-hidden','true');img.decoding='async';img.loading='lazy';img.src='data:image/webp;base64,'+images[key];card.replaceChildren(img);});}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();
          })();
          </script>'''
          image_obj = '{' + ','.join(f"{k}:'{v}'" for k,v in cards.items()) + '}'
          card_js = card_js.replace('{DIRECTIONS}', image_obj)

          # Network-friendly image defaults: only immediately visible images are eager.
          perf_js = '''<script>
          (()=>{function tune(){const imgs=[...document.images];imgs.forEach((img,i)=>{img.decoding='async';if(i<2){img.loading='eager';img.fetchPriority='high'}else{img.loading='lazy';img.fetchPriority='low'}});document.querySelectorAll('iframe').forEach(x=>x.loading='lazy')}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{tune();setTimeout(tune,400)},{once:true});else{tune();setTimeout(tune,400)}})();
          </script>'''

          injection = ''.join(inline_scripts[:4]) + card_js + ''.join(inline_scripts[4:]) + perf_js
          html = html.replace('</body>', injection + '</body>', 1)

          out = root / 'index-1rub-optimized.html'
          out.write_text(html, encoding='utf-8')

          # Build report: byte weights and references that still require network.
          data_imgs = re.findall(r'data:image/[^;]+;base64,([^\"\'\)\s]+)', html)
          external_imgs = re.findall(r'<img[^>]+src=[\"\'](?!data:)([^\"\']+)', html, flags=re.I)
          report = []
          report.append(f'optimized_index_bytes={out.stat().st_size}')
          report.append(f'optimized_index_kib={out.stat().st_size/1024:.1f}')
          report.append(f'embedded_data_images={len(data_imgs)}')
          report.append(f'embedded_data_images_binary_kib={sum(len(x)*3/4 for x in data_imgs)/1024:.1f}')
          report.append(f'external_img_refs={len(external_imgs)}')
          for k,v in card_files.items():
              txt=(root/'assets/cards-v87'/v)
              report.append(f'card_{k}_base64_bytes={txt.stat().st_size}')
              report.append(f'card_{k}_approx_webp_bytes={txt.stat().st_size*3//4}')
          report.append('external_images:')
          report.extend(external_imgs)
          (root/'optimization-report.txt').write_text('\n'.join(report), encoding='utf-8')

      - name: Commit optimized build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add club/index-1rub-optimized.html club/optimization-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Add optimized single-file 1-ruble club page [skip ci]"
          git push
