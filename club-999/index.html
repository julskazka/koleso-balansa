<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031c28"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Клуб «Центр Ресурса»</title><style>html,body{margin:0;min-height:100%;background:#031c28}body{display:grid;place-items:center;color:#f3d98f;font:600 15px Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}</style></head><body><div>Загружаем «Центр Ресурса»…</div><script>
(async()=>{try{
const files=['./payload-v48/part-01.txt','./payload-v48/part-02.txt','./payload-v48/part-03.txt','./payload-v48/part-04.txt','./payload-v48/part-05.txt','./payload-v48/part-06.txt','./payload-v48/p07-01.txt','./payload-v48/p07-02.txt','./payload-v48/p07-03.txt','./payload-v48/p07-04.txt','./payload-v48/p07-05.txt','./payload-v48/p07-06.txt','./payload-v48/p07-07.txt','./payload-v48/p07-08.txt','./payload-v48/p07-09.txt'];
const heroFiles=['./hero-v51/part-01.txt','./hero-v51/part-02.txt','./hero-v51/part-03.txt','./hero-v51/part-04.txt','./hero-v51/part-05.txt','./hero-v51/part-06.txt','./hero-v51/part-07.txt','./hero-v51/part-08.txt'];
const read=async paths=>(await Promise.all(paths.map(async path=>{const r=await fetch(path+'?v=52',{cache:'no-store'});if(!r.ok)throw new Error('Не удалось загрузить '+path);return r.text()}))).join('');
const [b64,heroB64]=await Promise.all([read(files),read(heroFiles)]);
if(typeof DecompressionStream==='undefined')throw new Error('Браузер не поддерживает распаковку страницы');
const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
const bgMatch=html.match(/<style id="single-continuous-nebula-v5">[\s\S]*?url\("(data:image\/jpeg;base64,[^"]+)"\)/);
const pageBg=bgMatch?bgMatch[1]:'';
html=html.replace(/(<img class="hero41__art" src=")data:image\/webp;base64,[^"]+(")/,(_,a,b)=>a+'data:image/webp;base64,'+heroB64+b);
html=html.replace('<h1>Найдите точку<br>опоры в той<br>сфере жизни,<br>которая сейчас<br>требует внимания</h1>','<h1>Найдите точку опоры в той сфере жизни, которая сейчас требует внимания</h1>')
.replace('<p><strong>6 направлений</strong> — тело, энергия,<br>дело, отношения, окружение и красота</p>','<p><strong>6 направлений</strong> — тело, энергия, дело, отношения, окружение и красота</p>')
.replace('<p><strong>Эфиры, конференции, практики</strong><br>и полезные материалы</p>','<p><strong>Эфиры, конференции, практики</strong> и полезные материалы</p>')
.replace('<p><strong>Сильные эксперты, живое общение</strong><br>и новые встречи каждый месяц</p>','<p><strong>Сильные эксперты, живое общение</strong> и новые встречи каждый месяц</p>');
const bgVar=pageBg?`<style>:root{--github-nebula-bg:url("${pageBg}")}</style>`:'';
html=html.replace('</head>',`<link rel="stylesheet" href="./v52.css?v=52">${bgVar}</head>`);
document.open();document.write(html);document.close();
}catch(error){console.error(error);document.body.innerHTML='<div>Не удалось загрузить страницу. Обновите её ещё раз.</div>'}})();
</script></body></html>
