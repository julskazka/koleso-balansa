<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#031c28">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Клуб «Центр Ресурса»</title>
<style>html,body{margin:0;min-height:100%;background:#031c28}body{display:grid;place-items:center;color:#f3d98f;font:600 15px Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}</style>
</head>
<body><div>Загружаем «Центр Ресурса»…</div>
<script>
(async()=>{
  try{
    const files=[
      './payload-v48/part-01.txt',
      './payload-v48/part-02.txt',
      './payload-v48/part-03.txt',
      './payload-v48/part-04.txt',
      './payload-v48/part-05.txt',
      './payload-v48/part-06.txt',
      './payload-v48/part-07a.txt',
      './payload-v48/part-07b.txt'
    ];
    const b64=(await Promise.all(files.map(async path=>{
      const response=await fetch(path+'?v=48',{cache:'no-store'});
      if(!response.ok) throw new Error('Не удалось загрузить '+path);
      return response.text();
    }))).join('');
    if(typeof DecompressionStream==='undefined') throw new Error('Браузер не поддерживает распаковку страницы');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div>Не удалось загрузить страницу. Обновите её ещё раз.</div>';
  }
})();
</script>
</body>
</html>
