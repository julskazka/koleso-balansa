<body><div>Загружаем «Центр Ресурса»…</div>
<script>
(async()=>{try{
const files=['./payload-v48/part-01.txt','./payload-v48/part-02.txt','./payload-v48/part-03.txt','./payload-v48/part-04.txt','./payload-v48/part-05.txt','./payload-v48/part-06.txt','./payload-v48/p07-01.txt','./payload-v48/p07-02.txt','./payload-v48/p07-03.txt','./payload-v48/p07-04.txt','./payload-v48/p07-05.txt','./payload-v48/p07-06.txt','./payload-v48/p07-07.txt','./payload-v48/p07-08.txt','./payload-v48/p07-09.txt'];
const heroFiles=['./hero-v51/part-01.txt','./hero-v51/part-02.txt','./hero-v51/part-03.txt','./hero-v51/part-04.txt','./hero-v51/part-05.txt','./hero-v51/part-06.txt','./hero-v51/part-07.txt','./hero-v51/part-08.txt'];
const read=async paths=>(await Promise.all(paths.map(async path=>{const r=await fetch(path+'?v=123',{cache:'no-store'});if(!r.ok)throw new Error('Не удалось загрузить '+path);return r.text()}))).join('');
const [b64,heroB64]=await Promise.all([read(files),read(heroFiles)]);
const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
let html='';
if(window.fflate&&window.fflate.gunzipSync){html=window.fflate.strFromU8(window.fflate.gunzipSync(bytes));}
else if(typeof DecompressionStream!=='undefined'){html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();}
else{throw new Error('Не удалось распаковать страницу в этом браузере');}
html=html.replace(/(<img class="hero41__art" src=")data:image\/webp;base64,[^"]+(")/,(_,a,b)=>a+'data:image/webp;base64,'+heroB64+b);
html=html.replace('<h1>Найдите точку<br>опоры в той<br>сфере жизни,<br>которая сейчас<br>требует внимания</h1>','<h1>Найдите точку опоры в той сфере жизни, которая сейчас требует внимания</h1>')
.replace('<p><strong>6 направлений</strong> — тело, энергия,<br>дело, отношения, окружение и красота</p>','<p><strong>6 направлений</strong> — тело, энергия, дело, отношения, окружение и красота</p>')
.replace('<p><strong>Эфиры, конференции, практики</strong><br>и полезные материалы</p>','<p><strong>Эфиры, конференции, практики</strong> и полезные материалы</p>')
.replace('<p><strong>Сильные эксперты, живое общение</strong><br>и новые встречи каждый месяц</p>','<p><strong>Сильные эксперты, живое общение</strong> и новые встречи каждый месяц</p>');
html=html.replace('</head>','<link rel="stylesheet" href="./v53.css?v=77"><link rel="stylesheet" href="./v61-bg.css?v=77"><link rel="stylesheet" href="./v62.css?v=77"><link rel="stylesheet" href="./v64.css?v=77"><link rel="stylesheet" href="./v65.css?v=77"><link rel="stylesheet" href="./v66.css?v=77"><link rel="stylesheet" href="./v105-hide-connection-visual.css?v=105"><link rel="stylesheet" href="./v114-expert-gallery-frame.css?v=116"><link rel="stylesheet" href="./v126-resource-icon-cleanup.css?v=126"></head>');
html=html.replace('</body>','<script src="./v71-clarity-heading.js?v=77"><\/script><script src="./v73-page-typography.js?v=77"><\/script><script src="./v74-layout-spacing.js?v=84"><\/script><script src="./v75-heading-fit-readability.js?v=77"><\/script><script src="./v76-clarity-cards.js?v=77"><\/script><script src="./v86-directions-popups.js?v=92"><\/script><script src="./v92-real-direction-cards.js?v=92"><\/script><script src="./v94-directions-desktop-3col.js?v=94"><\/script><script src="./v100-directions-approved-raster.js?v=100"><\/script><script src="./v103-cross-block-safe-width.js?v=103"><\/script><script src="./v106-connection-divider.js?v=106"><\/script><script src="./v107-materials-glass-cards.js?v=107"><\/script><script src="./v109-inside-payment-button-depth.js?v=109"><\/script><script src="./v110-expert-gallery.js?v=113"><\/script><script src="./v117-expert-section-spacing.js?v=119"><\/script><script src="./v120-feed-compact.js?v=120"><\/script><script src="./v121-resource-list-polish.js?v=125"><\/script><script src="./v133-resource-box-clean-rebuild.js?v=133"><\/script></body>');
html=html.replace(/<body([^>]*)>/i,'<body$1><div id="page-nebula-v61" aria-hidden="true"></div>');
document.open();document.write(html);document.close();
}catch(error){console.error(error);document.body.innerHTML='<div>Страница временно не загрузилась. Нажмите обновить ещё раз.</div>'}})();
</script>
