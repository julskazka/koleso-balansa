<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#063c36">
  <title>Колесо Баланса</title>
  <style>
    html,body{margin:0;min-height:100%;background:#031c28}
    .boot-screen{min-height:100svh;display:grid;place-items:center;background:#031c28;color:#f3d98f;font:600 16px Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
    [data-open-wheel-club],
    .continuation-note{display:none!important}
  </style>
  <script>
    (() => {
      /* Одноразовый тестовый сброс конкретного сохранённого аккаунта.
         Сам ID в публичном коде не хранится: сверяем только хэш ключа localStorage. */
      const RESET_KEY_HASH = 0xad1ee755;
      const RESET_MARKER = 'wheel_reset_20260915_v1_done';

      const fnv1a = (value) => {
        let hash = 0x811c9dc5;
        const bytes = new TextEncoder().encode(String(value));
        for (const byte of bytes) {
          hash ^= byte;
          hash = Math.imul(hash, 0x01000193) >>> 0;
        }
        return hash >>> 0;
      };

      try {
        if (localStorage.getItem(RESET_MARKER) !== '1') {
          for (let index = localStorage.length - 1; index >= 0; index -= 1) {
            const key = localStorage.key(index);
            if (key && fnv1a(key) === RESET_KEY_HASH) {
              localStorage.removeItem(key);
              sessionStorage.removeItem('wheelReflectionName');
              localStorage.setItem(RESET_MARKER, '1');
              break;
            }
          }
        }
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div id="app-root"><div class="boot-screen">Загружаем Колесо Баланса…</div></div>
  <script src="./page-loader.js?v=23"></script>
  <script src="./reflection-form-v24.js?v=24"></script>
  <script src="./free-spin-v24.js?v=24"></script>
  <script src="./free-spin-design-v25.js?v=25"></script>
  <script src="./naming-fix.js?v=3"></script>
  <script src="./mobile-first-screen-v22.js?v=22"></script>
  <script src="./price-51-v26.js?v=30"></script>
  <script src="./post-spin-block-v31.js?v=33"></script>
  <script src="./post-spin-decoration-clean-v34.js?v=34"></script>
  <script>
    (() => {
      const normalize = (value) => String(value || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
      const STAR_ONLY = /^[✦★✧✶✷✸✹✺✻✼⋆·•◆◇❖]+$/u;
      const removeExact = new Set([
        'Открыть все направления за 51 ₽',
        'Открыть все направления за 1 ₽',
        'Первая практика — наш подарок для вас. Остальные направления доступны в клубе.',
        'В клубе можно открыть все шесть направлений и выбирать практики под своё состояние.',
        'Но одна практика — это только начало. В клубе можно открыть все шесть направлений и выбирать практики под своё состояние, а не ждать случайного результата.'
      ]);

      function removeDecorationNear(element) {
        let next = element?.nextElementSibling;
        while (next) {
          const text = normalize(next.textContent);
          const decorative = !text || STAR_ONLY.test(text);
          if (!decorative) break;
          const current = next;
          next = next.nextElementSibling;
          current.remove();
        }
      }

      function removeStandaloneDecorations() {
        document.querySelectorAll('div,span,p,section,hr').forEach((element) => {
          if (!element.isConnected) return;
          const text = normalize(element.textContent);
          const className = String(element.className || '').toLowerCase();
          const looksDecorative = STAR_ONLY.test(text) ||
            ((className.includes('divider') || className.includes('separator') || className.includes('ornament')) && (!text || STAR_ONLY.test(text)));
          if (!looksDecorative) return;

          let target = element;
          let parent = target.parentElement;
          while (
            parent &&
            parent !== document.body &&
            parent.id !== 'app-root' &&
            normalize(parent.textContent) === text &&
            parent.children.length <= 4
          ) {
            target = parent;
            parent = target.parentElement;
          }
          target.remove();
        });
      }

      function cleanUpsell() {
        document.querySelectorAll('[data-open-wheel-club]').forEach((element) => element.remove());
        document.querySelectorAll('.continuation-note').forEach((element) => element.remove());

        document.querySelectorAll('p,div,span,section,a,button').forEach((element) => {
          const text = normalize(element.textContent);
          if (!removeExact.has(text)) return;
          removeDecorationNear(element);
          element.remove();
        });

        removeStandaloneDecorations();
      }

      cleanUpsell();
      document.addEventListener('DOMContentLoaded', cleanUpsell, { once: true });
      const observer = new MutationObserver(() => requestAnimationFrame(cleanUpsell));
      observer.observe(document.documentElement, { childList: true, subtree: true });
      [100, 250, 500, 900, 1500, 2500, 4000].forEach((delay) => setTimeout(cleanUpsell, delay));
    })();
  </script>
</body>
</html>
