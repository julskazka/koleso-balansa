<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#063c36">
  <title>Колесо Баланса</title>
  <style>
    html,body{margin:0;min-height:100%;background:#031c28}
    .boot-screen{min-height:100svh;display:grid;place-items:center;background:#031c28;color:#f3d98f;font:600 16px Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
    [data-open-wheel-club],
    .continuation-note,
    .wheel-used-footnote-v25,
    .wheel-used-divider-v25{display:none!important}
  </style>
</head>
<body>
  <div id="app-root"><div class="boot-screen">Загружаем Колесо Баланса…</div></div>
  <script src="./page-loader.js?v=23"></script>
  <script src="./reflection-form-v24.js?v=24"></script>
  <script>
    (() => {
      const TARGET_ID_HASH = 0xe685960e;
      const RESET_MARKER = 'wheel_reset_20260915_v2_done';
      const STORAGE_PREFIX = 'wheel_free_spin_v24';
      const BROWSER_KEY = `${STORAGE_PREFIX}:browser`;

      const normalize = (value) => String(value ?? '').trim();
      const fnv1a = (value) => {
        let hash = 0x811c9dc5;
        const bytes = new TextEncoder().encode(normalize(value));
        for (const byte of bytes) {
          hash ^= byte;
          hash = Math.imul(hash, 0x01000193) >>> 0;
        }
        return hash >>> 0;
      };

      const loadFreeSpin = () => {
        const script = document.createElement('script');
        script.src = './free-spin-v24.js?v=25';
        script.async = false;
        document.head.appendChild(script);
      };

      const getTelegramWebId = () => {
        try {
          return window.Telegram?.WebApp?.initDataUnsafe?.user?.id || '';
        } catch (_) {
          return '';
        }
      };

      const resetForTarget = () => {
        const notibot = window.NotibotIntegration;
        if (!notibot) return false;

        const identity = notibot.getIdentity?.() || {};
        const user = notibot.getUser?.() || {};
        const candidates = [
          identity.telegramId,
          identity.telegram_id,
          user.telegramId,
          user.telegram_id,
          user.id,
          user.userId,
          user.user_id,
          getTelegramWebId()
        ].map(normalize).filter(Boolean);

        const isTarget = candidates.some((value) => fnv1a(value) === TARGET_ID_HASH);
        if (!isTarget) return Boolean(notibot.getState?.().connected);

        if (localStorage.getItem(RESET_MARKER) !== '1') {
          const primaryIdentity = normalize(
            identity.notibotUserId ||
            identity.telegramId ||
            identity.maxId ||
            user.notibotUserId ||
            user.id ||
            user.userId ||
            user.user_id
          );

          if (primaryIdentity) {
            localStorage.removeItem(`${STORAGE_PREFIX}:account:${encodeURIComponent(primaryIdentity)}`);
          }
          localStorage.removeItem(BROWSER_KEY);
          sessionStorage.removeItem('wheelReflectionName');
          localStorage.setItem(RESET_MARKER, '1');
        }
        return true;
      };

      (async () => {
        const startedAt = Date.now();
        while (Date.now() - startedAt < 5000) {
          try {
            if (resetForTarget()) break;
          } catch (_) {}
          await new Promise((resolve) => setTimeout(resolve, 80));
        }
        loadFreeSpin();
      })();
    })();
  </script>
  <script src="./saved-practice-instant-v38.js?v=38"></script>
  <script src="./free-spin-design-v25.js?v=26"></script>
  <script src="./sector-sync-v39.js?v=39"></script>
  <script src="./naming-fix.js?v=3"></script>
  <script src="./mobile-first-screen-v22.js?v=22"></script>
  <script src="./price-51-v26.js?v=30"></script>
  <script src="./post-spin-block-v31.js?v=33"></script>
  <script src="./post-spin-decoration-clean-v34.js?v=34"></script>
  <script>
    (() => {
      const normalize = (value) => String(value || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
      const STAR_ONLY = /^[✦★✧✶✷✸✹✺✻✼⋆·•◆◇❖]+$/u;
      const removeExact = new Set([
        'Открыть все направления за 51 ₽',
        'Открыть все направления за 1 ₽',
        'Первая практика — наш подарок для вас. Остальные направления доступны в клубе.',
        'В клубе можно открыть все шесть направлений и выбирать практики под своё состояние.',
        'Но одна практика — это только начало. В клубе можно открыть все шесть направлений и выбирать практики под своё состояние, а не ждать случайного результата.'
      ]);

      function cleanUpsell() {
        document.querySelectorAll('[data-open-wheel-club], .continuation-note, .wheel-used-footnote-v25, .wheel-used-divider-v25')
          .forEach((element) => element.remove());

        document.querySelectorAll('p,div,span,section,a,button').forEach((element) => {
          if (!element.isConnected) return;
          const text = normalize(element.textContent);
          if (removeExact.has(text)) element.remove();
        });

        document.querySelectorAll('div,span,p,section,hr').forEach((element) => {
          if (!element.isConnected) return;
          const text = normalize(element.textContent);
          const className = String(element.className || '').toLowerCase();
          if (STAR_ONLY.test(text) || ((className.includes('divider') || className.includes('separator')) && (!text || STAR_ONLY.test(text)))) {
            element.remove();
          }
        });
      }

      cleanUpsell();
      document.addEventListener('DOMContentLoaded', cleanUpsell, { once: true });
      const observer = new MutationObserver(() => requestAnimationFrame(cleanUpsell));
      observer.observe(document.documentElement, { childList: true, subtree: true });
      [100, 250, 500, 900, 1500, 2500, 4000].forEach((delay) => setTimeout(cleanUpsell, delay));
    })();
  </script>
</body>
</html>
